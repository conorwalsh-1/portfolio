name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type & schema check
        run: npm run check

      - name: Run unit tests with coverage gate
        run: npm run test:coverage

      - name: Build
        run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cdk/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix cdk

      # The stack uploads dist/, so synth needs a fresh build.
      - name: Build site
        run: npm run build

      - name: Test CDK stack
        working-directory: cdk
        run: npm test -- --runInBand

      - name: Synthesize CDK stack (with and without CloudFront)
        working-directory: cdk
        run: |
          npx cdk synth --quiet
          npx cdk synth --quiet -c cloudfront=false

  e2e:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run end-to-end and accessibility tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
