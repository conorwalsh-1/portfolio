version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      lint:
        patterns: ['eslint', 'eslint-*', 'typescript-eslint']
      test:
        patterns: ['vitest', '@vitest/*', '@playwright/test', '@axe-core/*', 'happy-dom']
    ignore:
      # TypeScript 7 is not yet supported by @astrojs/check or typescript-eslint.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /cdk
    schedule:
      interval: weekly
    groups:
      aws-cdk:
        patterns: ['aws-cdk', 'aws-cdk-lib', 'constructs']
      jest:
        patterns: ['jest', '@types/jest', '@swc/*']
    ignore:
      # Lambda and CI run Node 24; keep the types on the same major.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
